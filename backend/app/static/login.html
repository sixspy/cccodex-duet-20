<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"/><title>对拍登录</title>
<link rel="stylesheet" href="/styles.css"/></head>
<body class="登录壳">
<form class="登录卡" method="get" action="/">
  <div class="牌">对拍</div>
  <p class="副">双轨装载 · 键对齐 · 悬账 · 结论</p>
  <label>账号 <input name="user" value="admin" autocomplete="username"/></label>
  <label>密码 <input name="password" type="password" value="123456" autocomplete="current-password"/></label>
  <button type="submit">登录</button>
  <p class="提示">默认账号 admin / 密码 123456</p>
</form>
</body></html>
