<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>左轨流水 · 对拍</title>
  <link rel="stylesheet" href="/styles.css"/>
</head>
<body>
  <div class="壳">
    <header class="顶栏">
      <div class="顶左">
        <div class="牌名">对拍</div>
        <div class="牌骨">左轨装载 → 右轨装载 → 同键对齐落差 → 单边悬账 → 对拍结论</div>
      </div>
      <nav class="管线">
          <a href="/">对拍台</a>
          <a href="/左轨.html" class="亮">左轨流水</a>
          <a href="/右轨.html">右轨流水</a>
          <a href="/对齐差.html">对齐差表</a>
          <a href="/悬账单.html">悬账单</a>
          <a href="/对拍结论.html">对拍结论</a>
          <a href="/源登记.html">源登记</a>
          <a href="/轨规.html">轨规</a>
      </nav>
    </header>
    <main class="主">

      <section class="行卡">
        <h1>左轨流水 · 渠道回执</h1>
        <p class="说明">只装左轨。与右轨独立；对齐在「对齐差表」做。</p>
        <div class="工具条">
          <select id="夹具"></select>
          <button id="灌">灌入左轨夹具</button>
          <button class="次" id="刷">刷新</button>
        </div>
        <pre class="报" id="报"></pre>
      </section>
      <section class="行卡"><div id="表"></div></section>

    </main>
  </div>
  <script src="/common.js"></script>
  <script>
(async () => {
  const fixtures = (await get("/api/夹具")).filter(x => x.includes("左"));
  const sel = document.getElementById("夹具");
  sel.innerHTML = fixtures.map(f => `<option value="${f}">${f}</option>`).join("") || '<option value="左轨样例">左轨样例</option>';
  const paint = async () => {
    const rows = await get("/api/左轨");
    document.getElementById("表").innerHTML = 表(
      ["事件编号","业务键","金额分","源键","命运","事件时","批次"],
      rows,
      r => `<td>${r.事件编号}</td><td>${r.业务键}</td><td>${r.金额分}</td><td>${r.源键}</td><td>${徽(r.命运)}</td><td>${r.事件时}</td><td>${r.批次编号}</td>`
    );
  };
  await paint();
  document.getElementById("灌").onclick = async () => {
    const r = await post("/api/左轨/夹具/" + encodeURIComponent(sel.value));
    document.getElementById("报").textContent = JSON.stringify(r, null, 2);
    await paint();
  };
  document.getElementById("刷").onclick = paint;
})();
</script>
</body>
</html>
